workflows:
  ios-cordova-workflow:
    name: Cordova iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      vars:
        XCODE_FLAG_incremental: "NO"
    scripts:
      - name: Instalar Cordova globalmente
        script: |
          npm install -g cordova
      - name: Instalar dependencias npm
        script: |
          npm install
      - name: Agregar plataforma iOS
        script: |
          cordova platform add ios --confirm --no-interactive
      - name: Compilar proyecto iOS omitiendo errores de headers privados
        script: |
          # Forzamos la compilación pasando flags a xcodebuild para que ignore el error de encabezados privados en plugins
          npx cordova build ios --debug --buildFlag="-Wno-error=private-header" --buildFlag="GCC_TREAT_WARNINGS_AS_ERRORS=NO"
    artifacts:
      - platforms/ios/build/emulator/*.app
      - platforms/ios/build/**/*.app