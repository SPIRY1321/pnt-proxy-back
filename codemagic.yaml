workflows:
  ios-cordova-workflow:
    name: Cordova iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      vars:
        XCODE_FLAG_incremental: "NO"
    scripts:
      - name: Instalar Cordova globalmente
        script: |
          npm install -g cordova
      - name: Instalar dependencias npm
        script: |
          npm install
      - name: Agregar plataforma iOS
        script: |
          cordova platform add ios --confirm --no-interactive
      - name: Compilar proyecto iOS (Sin firma estricta)
        script: |
          # Compilamos para simulador/dispositivo de forma genérica para extraer los binarios sin requerir Apple Developer Team pago
          cordova build ios --release --device --no-codesign
    artifacts:
      - platforms/ios/build/device/*.app
      - platforms/ios/build/device/*.ipa