workflows:
  ios-cordova-workflow:
    name: Cordova iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      vars:
        # Esto evita que los errores de código antiguo de los plugins detengan la compilación
        XCODE_FLAG_incremental: "NO"
    scripts:
      - name: Instalar Cordova globalmente
        script: |
          npm install -g cordova
      - name: Instalar dependencias npm
        script: |
          npm install
      - name: Agregar plataforma iOS
        script: |
          cordova platform add ios --confirm --no-interactive
      - name: Compilar proyecto iOS para Dispositivo (.ipa)
        script: |
          cordova build ios --release --device --no-codesign
    artifacts:
      - platforms/ios/build/device/*.ipa