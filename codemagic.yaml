workflows:
  ios-cordova-workflow:
    name: Cordova iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      vars:
        XCODE_FLAG_incremental: "NO"
    scripts:
      - name: Instalar Cordova globalmente
        script: |
          npm install -g cordova
      - name: Instalar dependencias npm
        script: |
          npm install
      - name: Agregar plataforma iOS
        script: |
          cordova platform add ios --confirm --no-interactive
      - name: Compilar proyecto iOS sin empaquetado estricto
        script: |
          # Usamos build normal sin la bandera --device para evitar el bloqueo de Archive
          cordova build ios --debug
    artifacts:
      - platforms/ios/build/emulator/*.app
      - platforms/ios/build/**/*.app