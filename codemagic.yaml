workflows:
  ios-cordova-workflow:
    name: Cordova iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      vars:
        XCODE_FLAG_incremental: "NO"
    scripts:
      - name: Instalar Cordova globalmente
        script: |
          npm install -g cordova
      - name: Instalar dependencias npm
        script: |
          npm install
      - name: Agregar plataforma iOS
        script: |
          cordova platform add ios --confirm --no-interactive
      - name: Compilar proyecto iOS (Modo sin archivo estricto)
        script: |
          # Compilamos usando build directo en lugar de archive para evitar la validación obligatoria de Apple Team
          npx cordova build ios --debug --device
    artifacts:
      - platforms/ios/build/device/*.app
      - platforms/ios/build/**/*.app